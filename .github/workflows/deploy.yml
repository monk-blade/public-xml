name: Deploy RSS Feeds to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Create site structure
        run: |
          # Create the site directory structure
          mkdir -p _site/feeds
          
          # Copy static files
          cp index.html styles.css _site/
          
          # Copy all feed files in one operation
          [ -d "feeds" ] && find feeds -type f \( -name "*.xml" -o -name "*.rss" -o -name "*.atom" -o -name "*.json" \) -exec cp {} _site/feeds/ \; || true
          
          # Count feeds dynamically and update index.html
          FEED_COUNT=$(find feeds -type f \( -name "*.xml" -o -name "*.rss" -o -name "*.atom" -o -name "*.json" \) | wc -l)
          sed -i "s/20 Active Feeds/${FEED_COUNT} Active Feeds/g" _site/index.html
          
          # List what we're deploying
          echo "Site contents:"
          find _site -type f | sort
      
      - name: Minify CSS and HTML
        run: |
          # Install minification tools
          npm install -g clean-css-cli html-minifier
          
          # Minify CSS and update HTML reference in one step
          cleancss -o _site/styles.min.css _site/styles.css
          sed -i 's/styles\.css/styles.min.css/g' _site/index.html
          
          # Minify HTML in place
          html-minifier --collapse-whitespace --remove-comments --minify-css true --minify-js true -o _site/index.html _site/index.html
          
          # Clean up unminified CSS and show size savings
          rm _site/styles.css
          echo "Optimized file sizes:"
          ls -lh _site/index.html _site/styles.min.css
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4